services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./.env
