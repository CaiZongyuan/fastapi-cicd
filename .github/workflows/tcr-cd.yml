name: tcr-cd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to push (e.g. v0.1.0). If empty, uses the pushed tag ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: self-hosted
    env:
      BUILDX_CACHE_ROOT: /tmp/fastapi-cicd-buildx-cache
      DOCKER_CONFIG: /tmp/fastapi-cicd-docker-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker config dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login (Tencent Cloud TCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REG="${{ secrets.TCR_REGISTRY }}"
          NS="${{ secrets.TCR_NAMESPACE }}"

          TAG_INPUT="${{ inputs.tag }}"
          if [[ -n "${TAG_INPUT}" ]]; then
            TAG="${TAG_INPUT}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            echo "Expected a tag push (v*) or provide workflow_dispatch input 'tag'. Current ref: ${GITHUB_REF}." >&2
            exit 1
          fi
          {
            echo "backend_tags<<EOF"
            echo "${REG}/${NS}/fastapi-cicd-backend:${TAG}"
            echo "${REG}/${NS}/fastapi-cicd-backend:latest"
            echo "EOF"
            echo "nginx_tags<<EOF"
            echo "${REG}/${NS}/fastapi-cicd-nginx:${TAG}"
            echo "${REG}/${NS}/fastapi-cicd-nginx:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare local Buildx cache dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BUILDX_CACHE_ROOT}/backend" "${BUILDX_CACHE_ROOT}/nginx"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_ROOT }}/backend
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_ROOT }}/backend-new,mode=max

      - name: Finalize backend cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "${BUILDX_CACHE_ROOT}/backend-new" ]]; then
            rm -rf "${BUILDX_CACHE_ROOT}/backend"
            mv "${BUILDX_CACHE_ROOT}/backend-new" "${BUILDX_CACHE_ROOT}/backend"
          fi

      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.nginx_tags }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_ROOT }}/nginx
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_ROOT }}/nginx-new,mode=max

      - name: Finalize nginx cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "${BUILDX_CACHE_ROOT}/nginx-new" ]]; then
            rm -rf "${BUILDX_CACHE_ROOT}/nginx"
            mv "${BUILDX_CACHE_ROOT}/nginx-new" "${BUILDX_CACHE_ROOT}/nginx"
          fi
