name: tcr-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login (Tencent Cloud TCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REG="${{ secrets.TCR_REGISTRY }}"
          NS="${{ secrets.TCR_NAMESPACE }}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            {
              echo "backend_tags<<EOF"
              echo "${REG}/${NS}/fastapi-cicd-backend:${TAG}"
              echo "EOF"
              echo "nginx_tags<<EOF"
              echo "${REG}/${NS}/fastapi-cicd-nginx:${TAG}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          {
            echo "backend_tags<<EOF"
            echo "${REG}/${NS}/fastapi-cicd-backend:sha-${SHA_SHORT}"
            echo "${REG}/${NS}/fastapi-cicd-backend:latest"
            echo "EOF"
            echo "nginx_tags<<EOF"
            echo "${REG}/${NS}/fastapi-cicd-nginx:sha-${SHA_SHORT}"
            echo "${REG}/${NS}/fastapi-cicd-nginx:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.nginx_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
